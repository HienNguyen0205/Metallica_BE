name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Orchestrator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The suites live under tests/, and Python puts the *script's* directory
      # on sys.path rather than the working directory — without this, `from
      # friday import ...` fails with ModuleNotFoundError.
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # §15 short-term memory: replay into the prompt, session isolation, caps.
      - name: Memory tests
        run: python tests/unit/test_memory.py

      # §22 abuse gate: origin check and both rate-limit windows.
      - name: Guard tests
        run: python tests/unit/test_guard.py

      # The 429 message must name which limit refused the call.
      - name: Quota detail tests
        run: python tests/unit/test_quota_detail.py

      # read_note: listing, reading, path confinement, and that it stays low-risk.
      - name: Read note tests
        run: python tests/unit/test_read_note.py

      # Event contract, §11 permission gate, §22 tool sandboxing.
      - name: Transport and permission tests
        run: python tests/integration/test_stream.py

      # §10 web search: missing key, provider failure, result trimming.
      - name: Web search tool tests
        run: python tests/integration/test_search.py

      # The real agent loop and planner against a local fake provider.
      # No API key, no network, no cost.
      - name: Model gateway tests
        run: python tests/integration/test_provider.py
