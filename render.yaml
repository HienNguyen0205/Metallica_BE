# Render Blueprint. Create the service with:
#   Render dashboard -> New -> Blueprint -> pick this repo
#
# Deliberately a single uvicorn process, not gunicorn with workers: §11
# approvals live in an in-process dict (`PENDING` in friday/main.py), so a
# second worker would answer /confirm without holding the Future the streaming
# request is waiting on. Every high-risk tool would then time out as denied,
# and only for some requests.

services:
  - type: web
    name: friday-orchestrator
    runtime: python
    plan: free
    healthCheckPath: /health

    buildCommand: pip install -r requirements.txt
    # --host 0.0.0.0 is required: bound to localhost the health check cannot
    # reach it and the deploy never goes live. $PORT is assigned by Render.
    startCommand: uvicorn friday.main:app --host 0.0.0.0 --port $PORT

    envVars:
      # The code uses `X | None` and builtin generics, so 3.10 is the floor.
      - key: PYTHON_VERSION
        value: "3.12.7"

      # Set in the dashboard, never in this file — it is committed.
      - key: GEMINI_API_KEY
        sync: false

      # MUST be set to the deployed frontend's origin. The default is
      # http://localhost:3000, which the browser will refuse in production, and
      # a CORS rejection is visible only in the browser console — the server
      # logs a clean 200 and you will look in the wrong place for an hour.
      - key: FRIDAY_ALLOWED_ORIGINS
        sync: false
